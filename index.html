<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GovSpirit · Excise Warehouse Intelligence</title>

    <meta
      name="description"
      content="Warehouse analytics for state excise depots. Reads your stock spreadsheet in the browser and returns KPIs, a storage plan and prioritised actions. No upload, no server, no account."
    />
    <meta name="theme-color" content="#111412" />
    <meta name="color-scheme" content="dark light" />
    <meta name="author" content="Shreyas Thakur" />
    <link rel="canonical" href="https://shreyasthakur11.github.io/govspirit-warehouse/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="GovSpirit Warehouse Intelligence" />
    <meta
      property="og:description"
      content="Turn a warehouse stock spreadsheet into KPIs, a storage plan and prioritised actions. Runs entirely in the browser."
    />
    <meta property="og:url" content="https://shreyasthakur11.github.io/govspirit-warehouse/" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3.5 13 16 4.5 28.5 13v13.5a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5V13Z' fill='none' stroke='%230f6f62' stroke-width='2.4' stroke-linejoin='round'/%3E%3Cpath d='M10.5 23v-3.5M16 23v-6' stroke='%230f6f62' stroke-width='2.4' stroke-linecap='round' opacity='0.55'/%3E%3Cpath d='M21.5 23v-8.5' stroke='%23c07a2c' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E"
    />

    <!--
      Inter is loaded without blocking the first paint. The page renders in the
      system UI font immediately and swaps when the webfont arrives, so a slow
      font CDN can no longer delay the interface.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    </noscript>

    <!-- Stylesheets are layered: tokens, base, layout, components, pages. -->
    <link rel="stylesheet" href="assets/css/01-tokens.css" />
    <link rel="stylesheet" href="assets/css/02-base.css" />
    <link rel="stylesheet" href="assets/css/03-layout.css" />
    <link rel="stylesheet" href="assets/css/04-components.css" />
    <link rel="stylesheet" href="assets/css/05-pages.css" />

    <!--
      Chart.js is the only third-party script fetched up front, pinned with an
      integrity digest. SheetJS, jsPDF and html2canvas total roughly 1.4 MB and
      are fetched on first use by src/ui/exporters.js instead.
    -->
    <script
      src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
      integrity="sha384-JUh163oCRItcbPme8pYnROHQMC6fNKTBWtRG3I3I0erJkzNgL7uxKlNwcrcFKeqF"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      defer
    ></script>

    <script>
      // Set the stored theme before the first paint so there is no flash of the
      // wrong colour scheme. src/core/theme.js takes over from here.
      (function () {
        try {
          var stored = localStorage.getItem('govspirit:theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <div class="boot-screen" id="boot-screen" role="status" aria-live="polite">
      <svg class="boot-mark" width="44" height="44" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path
          d="M3.5 13 16 4.5 28.5 13v13.5a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5V13Z"
          stroke="currentColor"
          stroke-width="2.1"
          stroke-linejoin="round"
        />
        <path
          d="M10.5 23v-3.5M16 23v-6"
          stroke="currentColor"
          stroke-width="2.1"
          stroke-linecap="round"
          opacity="0.55"
        />
        <path d="M21.5 23v-8.5" stroke="#c07a2c" stroke-width="2.4" stroke-linecap="round" />
      </svg>
      <p class="boot-title">GovSpirit</p>
      <p class="boot-subtitle">Excise warehouse intelligence</p>
      <div class="boot-track" aria-hidden="true"><div class="boot-indicator"></div></div>
      <span class="visually-hidden">Loading</span>
    </div>

    <div id="app">
      <aside id="sidebar"></aside>
      <!-- Inert on wide screens. The drawer media query turns it into a scrim. -->
      <div id="sidebar-scrim"></div>

      <div id="main-wrapper">
        <header id="topbar"></header>
        <section id="filter-panel" aria-labelledby="filter-panel-title"></section>
        <main id="main-content" tabindex="-1"></main>
      </div>
    </div>

    <noscript>
      <div style="padding: 2rem; max-width: 44rem; margin: 0 auto; font-family: system-ui">
        <h1>JavaScript is required</h1>
        <p>
          GovSpirit does all of its work inside your browser: reading spreadsheets, computing figures and drawing
          charts. There is no server to fall back on, so the application cannot run with JavaScript turned off.
        </p>
      </div>
    </noscript>

    <!-- ================================================================
         Scripts load in dependency order. Classic scripts rather than ES
         modules, so the page still works when opened straight from disk.
         ================================================================ -->

    <!-- Namespace and messaging -->
    <script src="src/core/govspirit.js"></script>
    <script src="src/core/eventBus.js"></script>

    <!-- Pure helpers -->
    <script src="src/lib/html.js"></script>
    <script src="src/lib/format.js"></script>
    <script src="src/lib/collections.js"></script>
    <script src="src/lib/dom.js"></script>

    <!-- Presentation primitives -->
    <script src="src/ui/icons.js"></script>
    <script src="src/core/store.js"></script>
    <script src="src/core/theme.js"></script>
    <script src="src/ui/charts.js"></script>
    <script src="src/ui/components.js"></script>
    <script src="src/ui/exporters.js"></script>

    <!-- Domain data -->
    <script src="src/data/referenceData.js"></script>
    <script src="src/data/demoData.js"></script>

    <!-- Ingestion -->
    <script src="src/ingestion/fileReader.js"></script>
    <script src="src/ingestion/smartMapper.js"></script>
    <script src="src/ingestion/listParser.js"></script>
    <script src="src/ingestion/dataValidator.js"></script>
    <script src="src/ingestion/dataTransformer.js"></script>

    <!-- Analytics -->
    <script src="src/analytics/kpiEngine.js"></script>
    <script src="src/analytics/classificationEngine.js"></script>
    <script src="src/analytics/agingEngine.js"></script>
    <script src="src/analytics/utilizationEngine.js"></script>
    <script src="src/analytics/recommendationEngine.js"></script>
    <script src="src/analytics/pipeline.js"></script>

    <!-- Filters, routing and shell -->
    <script src="src/filters/filterManager.js"></script>
    <script src="src/core/router.js"></script>
    <script src="src/ui/shell.js"></script>

    <!-- Views -->
    <script src="src/pages/import.js"></script>
    <script src="src/pages/executive.js"></script>
    <script src="src/pages/inventory.js"></script>
    <script src="src/pages/warehouse.js"></script>

    <script src="src/pages/hotels.js"></script>
    <script src="src/pages/brandSupplier.js"></script>

  </body>
</html>
